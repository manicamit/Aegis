# AEGIS production compose — Next.js frontend + FastAPI backend.
# Data/models come from the synthetic pipeline (data/synthetic/processed,
# models/synthetic) generated by run_synthetic_pipeline.py — no Git LFS needed.
# The browser only talks to the frontend (port 80); the frontend's server-side
# route handlers reach the API in-cluster via FASTAPI_URL. Dash is not included.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: aegis-api:latest
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - LLM_PROVIDER=${LLM_PROVIDER:-template}
      - MODEL_DIR=/app/models/synthetic
      - DATA_DIR=/app/data/synthetic/processed
      - AUDIT_LOG_PATH=/app/logs/audit.jsonl
    volumes:
      - ./models/synthetic:/app/models/synthetic:ro
      - ./data/synthetic/processed:/app/data/synthetic/processed:ro
      - ./logs:/app/logs
    expose:
      - "8000"        # internal only — not published to the host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - FASTAPI_URL=http://api:8000
      - NODE_ENV=production
    ports:
      - "80:3000"     # public entrypoint
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
